
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<body>
    <h1>Student Dashboard</h1>
    <hr>

    <p>Total Students: <strong id="student-count">0</strong></p>

    <label for="student-search">Search by name or email:</label>
    <input type="text" id="student-search" placeholder="Enter name or email">

    <br><br>

    <label for="program-filter">Filter by program:</label>
    <select id="program-filter">
        <option value="">All programs</option>
    </select>

    <button type="button" id="clear-filters">Clear Filters</button>
    <button type="button" id="refresh-students">Refresh Data</button>

    <p id="loading-message">Loading students...</p>
    <p id="error-message" style="color: red;"></p>
    <p id="result-count">Showing 0 of 0 students</p>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Program</th>
                <th>Year Level</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="student-table-body"></tbody>
    </table>

    <script src="{% static 'registration/js/student_dashboard.js' %}"></script>
</body>
</html>
